[package]
name = "smartdisk"
version = "1.0.3"
edition = "2021"
rust-version = "1.85"
description = "SmartDisk - a lightweight intelligent disk space analyzer for Windows"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.18"
rusqlite = { version = "0.41", features = ["bundled"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trash = "5.3"
rfd = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
thiserror = "2"
arboard = "3"
log = "0.4"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
